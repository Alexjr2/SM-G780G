name: Build r8q kernel

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  KERNEL_SOURCE_REPO: https://github.com/notkernel-oss/not_samsung.sm8250-4.19.git
  KERNEL_SOURCE_REF: staging

jobs:
  build-r8q:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@main
        with:
          # The Qualcomm WLAN Makefile runs git log on the checkout commit
          # and its parent while generating BUILD_TAG.
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            jq \
            libelf-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            lld \
            llvm \
            p7zip-full \
            python3 \
            tar \
            xz-utils \
            zstd \
            curl

      - name: Clone kernel source
        run: |
          set -euo pipefail
          rm -rf kernel-source
          git clone \
            --depth 1 \
            --branch "$KERNEL_SOURCE_REF" \
            "$KERNEL_SOURCE_REPO" \
            kernel-source
          test -f kernel-source/Makefile
          test -f kernel-source/arch/arm64/configs/vendor/kona-perf_defconfig
          test -f kernel-source/arch/arm64/configs/vendor/samsung/kona-sec-common.config
          test -f kernel-source/arch/arm64/configs/vendor/samsung/r8q.config
          test -f kernel-source/tools/dtc
          test -f kernel-source/tools/mkdtimg
          chmod +x kernel-source/tools/dtc kernel-source/tools/mkdtimg

      - name: Build r8q kernel
        run: |
          set -euo pipefail
          chmod +x build_sm8250.sh
          test -s stock_R8Q
          KERNEL_DIR="$GITHUB_WORKSPACE/kernel-source" \
          OUT_DIR="$GITHUB_WORKSPACE/out/r8q" \
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/tc/clang" \
          ./build_sm8250.sh

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8q-build-diagnostics
          path: |
            out/r8q/build.stderr.log
            out/r8q/.config
            out/r8q/include/config/kernel.release
          if-no-files-found: warn

      - name: Prepare release metadata
        run: |
          set -euo pipefail

          PACKAGE_FILE=$(find "$GITHUB_WORKSPACE/out/r8q" \
            -maxdepth 1 \
            -type f \
            -name 'r8q-*-kernel.tar' \
            -print -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "r8q kernel TAR was not found"
            find "$GITHUB_WORKSPACE/out/r8q" -maxdepth 3 -type f -print
            exit 1
          fi

          IMAGE_NAME=$(basename "$PACKAGE_FILE")
          KERNEL_VERSION=$(cat out/r8q/include/config/kernel.release)
          CLANG_VERSION=$(PATH="$GITHUB_WORKSPACE/tc/clang/bin:$PATH" clang --version | head -n1)
          LLD_VERSION=$(PATH="$GITHUB_WORKSPACE/tc/clang/bin:$PATH" ld.lld --version | head -n1)
          BUILD_TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")
          IMAGE_SHA256=$(sha256sum "$PACKAGE_FILE" | awk '{print $1}')
          IMAGE_SIZE=$(du -h "$PACKAGE_FILE" | awk '{print $1}')
          SOURCE_COMMIT=$(git -C "$GITHUB_WORKSPACE/kernel-source" rev-parse HEAD)

          printf '%s\n' "$KERNEL_VERSION" > out/KERNEL_VERSION.txt
          printf '%s\n' "$IMAGE_NAME" > out/IMAGE_NAME.txt
          printf '%s\n' "$SOURCE_COMMIT" > out/KERNEL_SOURCE_COMMIT.txt

          {
            echo "# r8q Kernel Build"
            echo
            echo "- **Build Time**: $BUILD_TIME (Asia/Shanghai)"
            echo "- **Device Codename**: r8q"
            echo "- **Linux Version**: $KERNEL_VERSION"
            echo "- **Kernel Package**: $IMAGE_NAME (boot.img + dtbo.img)"
            echo "- **Package Size**: $IMAGE_SIZE"
            echo "- **Image SHA-256**: $IMAGE_SHA256"
            echo "- **Source Repository**: $KERNEL_SOURCE_REPO"
            echo "- **Source Ref**: $KERNEL_SOURCE_REF"
            echo "- **Source Commit**: $SOURCE_COMMIT"
            echo "- **Clang Version**: $CLANG_VERSION"
            echo "- **LLD Version**: $LLD_VERSION"
            echo
            echo "**Done!**"
          } > out/RELEASE.md

          echo "KERNEL_VERSION=$KERNEL_VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: ncipollo/release-action@main
        with:
          artifacts: "${{ github.workspace }}/out/r8q/r8q-*-kernel.tar,${{ github.workspace }}/out/*.txt"
          name: "Kernel-${{ env.KERNEL_VERSION }}-${{ github.run_id }}"
          tag: "${{ github.run_id }}"
          bodyFile: "${{ github.workspace }}/out/RELEASE.md"
          allowUpdates: true
